name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: # rebuild manually after training a new model version

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/malick26/mlflow-with-daghub-course

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (fetches the latest model from DagsHub)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          no-cache: true # always download the latest model version
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            dagshub_token=${{ secrets.DAGSHUB_TOKEN }}

      - name: Smoke test /predict
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:latest"
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"inputs": [[0.0] * 64]}))')
          for i in $(seq 1 30); do
            if curl -sf -X POST http://localhost:8000/predict \
                 -H "Content-Type: application/json" -d "$PAYLOAD"; then
              echo; echo "API is up"; exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push --all-tags "$IMAGE"
